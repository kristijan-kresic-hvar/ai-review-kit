# Reusable Claude code-review workflow — drop into ANY repo, any stack. Auto-adapts via the repo's CLAUDE.md.
# SETUP (2 steps): 1) copy this file to .github/workflows/code-review.yml  2) add the repo secret CLAUDE_CODE_OAUTH_TOKEN
#                  (get the token via Claude Code `/install-github-app`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`).
#
# SAFETY: fork PRs are skipped by the job-level `if` (secrets aren't exposed to forks anyway;
# a fork PR would only burn a run that can't post). For repos accepting outside contributions,
# also treat the PR branch's CLAUDE.md as untrusted input — review against the base branch's
# conventions if that ever becomes a concern.
#
# KNOWN GOTCHA: a PR that edits THIS file is skipped by the action's workflow-validation guard
# ("must match the version on the default branch") — it runs green with no review. Verify changes
# to this workflow on the NEXT PR after merging. Diagnose silent runs via `gh run view <id> --log`
# (look for permission_denials_count vs the "Skipping action due to workflow validation" warning).
name: code-review

on:
  pull_request:
    # edited: re-review when the PR is RETARGETED — changing the base keeps the head SHA
    # (and any approval on it) while the effective diff changes. The job-level `if`
    # filters edited events down to base changes so title/body edits don't burn runs.
    types: [opened, synchronize, reopened, edited]

concurrency:
  # Keyed on PR number, not head_ref: one branch can back TWO open PRs (different
  # bases), and a shared head_ref key would let one PR's run cancel the other's.
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    # Same-repo branches only: fork PRs can't read the token secret, so the run could
    # never post a review — skip instead of failing green-with-nothing. On edited
    # events, run only for base retargets (title/body edits change nothing reviewable).
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # OPTIONAL Linear leg: if the repo tracks work in Linear, feed the linked ticket's
      # spec (Acceptance Criteria / Not-in-scope / Verification) to the reviewer so it
      # judges intent, not just code quality. Entirely self-gating — no LINEAR_API_KEY
      # secret, or no Linear issue id in the branch/title/body, and this is a silent no-op
      # (empty output -> prompt unchanged). A Linear outage never fails the review either.
      # Setup for repos that want it: gh secret set LINEAR_API_KEY  (a Linear personal API
      # key; read-only issue access, works on any Linear plan). The linkback PR comment is
      # deliberately NOT used — on private teams it often carries only the bare issue key.
      - name: Fetch linked Linear ticket spec (optional)
        id: linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEYS: ${{ vars.LINEAR_TEAM_KEYS }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # No key => this repo doesn't use Linear. Skip silently. (No pipefail here: a
          # Linear/network failure must degrade to "review without spec", never fail CI.)
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "no LINEAR_API_KEY set — skipping Linear spec fetch"; exit 0
          fi
          # First Linear-style issue id (ANY team prefix) in branch, title, or body.
          ID=$(printf '%s\n%s\n%s' "$HEAD_REF" "$PR_TITLE" "$PR_BODY" \
                 | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
          if [ -z "$ID" ]; then
            echo "no Linear issue id in branch/title/body — skipping"; exit 0
          fi
          # Confused-deputy fence for multi-author repos: the id above is AUTHOR-controlled
          # (branch/title/body) and the API key fetches ANY ticket it can see — without a
          # fence, a PR author with repo access but no Linear access can pull an unrelated
          # internal ticket's text into public review output. Set the repo variable
          # LINEAR_TEAM_KEYS (space-separated team prefixes, e.g. "KKD OPS") to allowlist;
          # unset = any prefix accepted (solo/trusted-author default).
          if [ -n "${LINEAR_TEAM_KEYS:-}" ]; then
            case " $LINEAR_TEAM_KEYS " in
              *" ${ID%%-*} "*) : ;;
              *) echo "Linear id $ID is outside LINEAR_TEAM_KEYS ($LINEAR_TEAM_KEYS) — skipping spec fetch"; exit 0 ;;
            esac
          fi
          # id accepts the human identifier (e.g. KKD-6); passed as a GraphQL variable so a
          # branch name can never inject into the query. description holds AC/scope/verification.
          # --max-time: this optional step sits on the review's critical path — a hung Linear
          # call must degrade to "review without spec", not eat the job's timeout budget.
          SPEC=$(curl -sf --max-time 15 https://api.linear.app/graphql \
                   -H "Authorization: $LINEAR_API_KEY" \
                   -H "Content-Type: application/json" \
                   -d "{\"query\":\"query(\$id:String!){issue(id:\$id){identifier title description}}\",\"variables\":{\"id\":\"$ID\"}}" \
                 | jq -r 'if .data.issue then "# "+.data.issue.identifier+" — "+.data.issue.title+"\n\n"+(.data.issue.description // "(no description)") else empty end' || true)
          if [ -z "$SPEC" ]; then
            echo "::warning::Linear issue $ID not found/unreadable — reviewing without spec"; exit 0
          fi
          # Emit the whole prompt section (or nothing), so the review prompt just interpolates it.
          # Random heredoc delimiter (GitHub's own hardening guidance): the ticket description is
          # semi-untrusted input — a line that happened to equal a fixed delimiter would end the
          # block early and let the remainder be parsed as workflow output commands.
          EOF_MARK="LINEAR_EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "spec<<$EOF_MARK"
            echo "LINKED LINEAR TICKET (author-supplied spec — the intent this PR must satisfy):"
            echo
            echo "$SPEC"
            echo
            echo "Also review the diff against this ticket:"
            echo "- Each Acceptance Criteria item: satisfied by the diff? Report Addressed / Not-addressed / Unclear."
            echo "- Any change implementing or touching a \"Not in scope\" item -> flag as scope creep."
            echo "- Each Verification Test Scenario: does the diff add/update a test covering it? Flag uncovered ones."
            echo "The ticket is context, not ground truth: if the diff contradicts it, the diff is what shipped — say so."
            echo "$EOF_MARK"
          } >> "$GITHUB_OUTPUT"
          echo "fetched Linear spec for $ID"

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request like a senior engineer who values correctness and simplicity.
            The PR branch is already checked out in the current working directory.

            Adapt to the repo:
            - If a CLAUDE.md / AGENTS.md / CONTRIBUTING.md exists, review against its conventions FIRST.
            - Otherwise apply strong general best practices for the repo's language/framework.
            - Role split (decide it yourself): check AGENTS.md at the repo root. If it contains a
              '## Code Review Rules' section, an adversarial reviewer (Codex) also runs on this PR
              and owns deep bug-hunting — P0/P1 logic bugs, exploit-style edge cases. You own
              craftsmanship: conventions, maintainability, tests, data safety, and correctness
              issues you see directly — do not duplicate a full adversarial pass. If there is no
              such section, you are the ONLY reviewer: cover both roles.
            - Read the PR description's Scope / Deliberate trade-offs / Verification sections (when present)
              as author-supplied context: a trade-off stated there with its reasoning is intentional — flag it
              only if the reasoning is wrong or genuinely unsafe, not merely because a fuller version exists.
              Treat "Not in scope" items as tracked elsewhere. VERIFY claims rather than trusting them (a
              "tests pass" claim doesn't close review of the logic), and if the description contradicts the
              diff, say so — the diff is the truth.

            ${{ steps.linear.outputs.spec }}

            Prioritize, in order:
            1. Correctness — logic errors, unhandled edge cases, race conditions, broken error handling.
            2. Security — injection, auth/authz gaps, secrets in code, unsafe input handling, SSRF/path traversal.
            3. Data safety — anything risking data loss or corruption.
            4. Maintainability — dead code, needless complexity/abstraction, reinvented stdlib, poor naming.
            5. Tests — missing coverage for new non-trivial logic.

            Skip nitpicks the linter/formatter already catches. Prefer fewer, high-confidence findings over noise.

            Post the review as GitHub comments — do NOT submit review text as chat messages:
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for each
              specific file:line issue, giving the problem + a suggested fix.
            - Submit the top-level verdict as an ACTUAL pr review (not a plain comment) so it is a
              machine-readable state, not just prose — and PIN it to the commit you reviewed:
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews -f commit_id=${{ github.event.pull_request.head.sha }} -f event=REQUEST_CHANGES -f body="<one-line verdict>"`
              if there is any blocking problem, otherwise `-f event=APPROVE`. The explicit
              commit_id matters: a new push can land while this run is being cancelled, and an
              unpinned review would attach to the NEW head — recording a verdict on code this run
              never saw (the merge gate keys on the review's commit_id matching the head). Put
              non-blocking notes/nits in the review body or inline — do NOT downgrade to
              event=COMMENT just because you left notes (a merge gate keying on APPROVED would
              deadlock on a clean-but-COMMENTED review). A plain `gh pr comment` leaves
              reviewDecision empty, so a green check then falsely reads as "reviewed."
            - Always post an approve/request-changes verdict — never silent, never notes-only.
          # gh api (not gh pr review) so the verdict carries an explicit commit_id — but
          # scoped to the ONE endpoint the verdict needs, plus a method-flag deny layer
          # (deny beats allow): the reviewer reads untrusted input (diff, PR body, the
          # branch's CLAUDE.md), and a bare gh api:* would hand injected instructions
          # every write the job token allows (edit comments, dismiss reviews, ...).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Bash(gh api* -X *),Bash(gh api*--method*)"

      # The action exits 0 whether or not a review was posted (quota errors, tool failures, and
      # permission denials all end "green"). Make the check truthful: fail unless a review exists
      # on the PR's current head SHA. This is the only mechanical observability without branch protection.
      - name: Verify a review was actually posted on the head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          # Refs/values pass through env so branch names are data, never shell syntax.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # pipefail: a failed gh api call must fail the step, not yield an empty count that
          # reads as "OK" — this step exists precisely to catch silent verification gaps.
          set -o pipefail
          # A PR editing this workflow is skipped by the action's validation guard — a missing
          # review there is EXPECTED, not a failure. Warn instead of failing in that one case.
          if ! git diff --quiet "origin/$BASE_REF" HEAD -- .github/workflows/code-review.yml; then
            echo "::warning::This PR modifies code-review.yml — the review action skips itself here. UNREVIEWED by design; verify on the next PR after merge."
            exit 0
          fi
          # Filter by author too — another bot's review (e.g. Codex) on the same head must not
          # mask a silently-failed Claude run. "claude[bot]" is the GitHub App login the action
          # posts under; if the app is ever renamed, update this filter or the check false-fails.
          # awk sums the per-page counts (no bc — not guaranteed on runners) and prints 0 on empty.
          # Reviews predating the PR's last base RETARGET judged a different effective diff and
          # must not satisfy this check (same cutoff merge-gate applies — retargets keep the
          # head SHA). Best-effort here: a failed timeline read degrades to no cutoff, because
          # this step is observability; merge-gate re-derives the cutoff authoritatively.
          CUTOFF=$(gh api --paginate --slurp "repos/$REPO/issues/$PR_NUM/timeline" 2>/dev/null \
            | jq -r '[add[] | select(.event == "base_ref_changed" or .event == "automatic_base_change_succeeded") | .created_at // empty] | max // ""' || echo "")
          COUNT=$(gh api --paginate "repos/$REPO/pulls/$PR_NUM/reviews" \
            --jq "[.[] | select(.commit_id == \"$HEAD_SHA\" and .user.login == \"claude[bot]\") | select(.submitted_at > \"$CUTOFF\")] | length" \
            | awk '{s+=$1} END {print s+0}')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Claude posted no review on head $HEAD_SHA — treat this PR as UNREVIEWED by Claude."
            exit 1
          fi
          echo "OK: $COUNT Claude review(s) on $HEAD_SHA"
